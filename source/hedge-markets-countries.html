let country='sg',savedCountry='sg';
function countryBar(){root.querySelectorAll('[data-country]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.country===country)));root.querySelector('.avatar').textContent=presets[country].code;root.querySelector('.tagline').innerHTML='A little more prepared.<br>For '+presets[country].people+' small businesses.';root.classList.toggle('motion-paused',!motion)}
function setupHero(){const h=main.querySelector('.hero');if(!h)return;const c=presets[country];const img=h.querySelector('.hero-art');img.src=c.image;img.alt=c.alt;h.querySelector('.hero-badge').textContent='LOCAL BUSINESS. GLOBAL WHAT-IFS. · '+c.label.toUpperCase();h.querySelector('#hm2-url').placeholder=c.placeholder;
const pause=h.querySelector('#hm-motion');pause.textContent=motion?'Ⅱ Pause motion':'▷ Play motion';pause.setAttribute('aria-pressed',String(motion));pause.onclick=()=>{motion=!motion;countryBar();pause.textContent=motion?'Ⅱ Pause motion':'▷ Play motion';pause.setAttribute('aria-pressed',String(motion))};
h.onpointermove=e=>{if(!motion||reduced.matches||e.pointerType==='touch')return;const r=h.getBoundingClientRect();h.classList.remove('idle');h.style.setProperty('--px',((e.clientX-r.left)/r.width-.5)*-15+'px');h.style.setProperty('--py',((e.clientY-r.top)/r.height-.5)*-8+'px')};h.onpointerleave=()=>{h.style.setProperty('--px','0px');h.style.setProperty('--py','0px');h.classList.add('idle')};
const detail=h.querySelector('.scene-card');function showSpot(which){h.querySelectorAll('[data-spot]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.spot===which)));detail.hidden=false;detail.innerHTML=which==='owner'?'<small>MEET YOUR NEIGHBOURHOOD</small><h3>'+escape(c.business)+'</h3><p>'+escape(c.owner)+'</p><button id="hm-use-local">Try this sample business →</button>':'<small>THE WORLD BEHIND THE COUNTER</small><h3>Supplies have a journey.</h3><p>'+escape(c.supply)+'</p><button id="hm-use-local">Explore its sample risks →</button>';detail.querySelector('button').onclick=()=>{company=c.business;category='all';render('review')};if(which==='owner'&&motion){h.classList.remove('greet');void h.offsetWidth;h.classList.add('greet');setTimeout(()=>h.classList.remove('greet'),1300)}}h.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>showSpot(b.dataset.spot));
}

function ticket(isTorn=false){return `<div class="printer-wrap"><div class="printer"><div class="printer-brand"><span class="mark"></span>${isTorn?'Your list, ready to keep':'Hedge Markets'}</div><div class="slot"></div></div><div class="receipt ${isTorn?'torn':''}"><h3>HEDGE MARKETS</h3><div class="receipt-head"><b>${escape(company.toUpperCase())}</b><br>ILLUSTRATIVE · 3 EVENTS</div><div class="receipt-row">FUEL <b>BUY YES</b><br>Brent above $100 on 31 Dec 2026?<small>Oil prices may not match your fuel bill.</small></div><div class="receipt-row">FREIGHT <b>BUY YES</b><br>Suez traffic below 2025 levels in Q4 2026?<small>Your suppliers may use different routes.</small></div><div class="receipt-row">RATES <b>BUY NO</b><br>Fed cuts rates by 31 Dec 2026?<small>US rates may diverge from your ${presets[country].currency} loan.</small></div><div class="receipt-warning">CHECK BEFORE YOU ACT<br>Sample events, not verified listings.<br>Check liquidity, price and event rules.<br>May not offset your business losses.<br>Contracts pay $1 or $0.<br>You can lose your stake.</div></div>${!isTorn&&page==='ticket'?'<button class="pull" id="hm2-pull"><span>↓</span>Pull down to review</button>':''}</div>`}
function render(p){page=p;countryBar();root.querySelector('#hm2-path').textContent=p==='home'?'':'/'+p;root.querySelector('#hm2-count').textContent=taken?'(1)':'';
if(p==='home')main.innerHTML=`<section class="hero idle"><img class="hero-art" src="${hero}" alt="Chibi hawker uncle cooking at Ah Huat Eats, with families, HDB blocks and tropical palms"><div class="scene-tools"><button id="hm-motion" type="button" aria-pressed="true">Ⅱ Pause motion</button></div><div class="hero-copy"><span class="hero-badge">MADE FOR EVERYDAY BUSINESS OWNERS</span><h1>Big world changes.<br>Small business impact.</h1><p>Turn your business risks into a simple <b>event-market shortlist.</b></p></div><div class="scene-hint">Move to explore · tap a business detail</div><div class="steam-group" aria-hidden="true"><span></span><span></span><span></span></div><button class="hotspot owner-spot" data-spot="owner" aria-pressed="false">Meet the owner</button><button class="hotspot supply-spot" data-spot="supply" aria-pressed="false">Follow the supplies</button><div class="scene-card" aria-live="polite" hidden></div><form class="intake" id="hm2-form"><label>Company website<input id="hm2-url" placeholder="yourbusiness.sg" aria-label="Company website"></label><label>Sector (optional)<select id="hm2-sector"><option>Food & beverage</option><option>Retail</option><option>Logistics</option><option>Manufacturing</option><option>Other / unsure</option></select></label><button class="primary" type="submit">Find my risks →</button><div id="hm2-error" class="error" role="alert" hidden></div></form><div class="steps"><div class="step"><em>1</em><span><b>Paste your URL</b>Tell us about your business</span></div><div class="step"><em>2</em><span><b>Review risks</b>Check what matters to you</span></div><div class="step"><em>3</em><span><b>Pull your ticket</b>Take your shortlist</span></div></div></section>`;
if(p==='review'){let visible=category==='all'?[0,1,2]:[data.findIndex(d=>d[0]===category)];main.innerHTML=`<section class="view"><div class="eyebrow">01 Business &nbsp; / &nbsp; 02 Review &nbsp; / &nbsp; 03 Ticket</div><div class="title-row"><h2>Does this sound like your business?</h2><span class="pill">Illustrative demo</span></div><div class="company"><div class="shop-icon">${icons('store')}</div><div><h3>${escape(company)}</h3><p class="muted">${presets[country].label} · Illustrative neighbourhood food business</p></div></div><div class="tabs"><button data-category="all" aria-pressed="${category==='all'}">Main risks</button>${data.map(d=>`<button data-category="${d[0]}" aria-pressed="${category===d[0]}">${icons(d[1])}${d[0]}</button>`).join('')}</div><div class="risk-grid">${visible.map(i=>`<article class="risk"><div class="risk-top">${icons(data[i][1])}<span class="pill">Editable</span></div><h3>${data[i][2]}</h3><p>${data[i][3]}</p><label>Relevance to your business<select data-rel="${i}">${['High','Medium','Low','Not relevant'].map(v=>`<option ${rel[i]===v?'selected':''}>${v}</option>`).join('')}</select></label></article>`).join('')}</div><div class="actions"><div class="info">${icons('info')}Sample assumptions, not a website scan. Please check before continuing.</div><button class="primary" id="hm2-create">Create hedge ticket →</button></div><p class="fine" id="hm2-match"></p></section>`}
if(p==='ticket')main.innerHTML=`<section class="view"><div class="eyebrow">YOUR SHORTLIST IS READY</div><div class="ticket-layout"><div class="ticket-copy"><h2>Your risks,<br>on one ticket.</h2><p>A simple shortlist of event markets based on the risks you reviewed.</p><div class="warning"><b>A shortlist,<br>not a safety net.</b>Event outcomes may not match your actual costs. Your business could lose money even if none of these contracts pays out.</div><details><summary>What does “BUY YES / NO” mean?</summary><p>A YES contract pays $1 if the event resolves YES, otherwise $0. NO pays the reverse. Price and fees determine your profit or loss.</p></details><p class="fine">Demo markets have not been verified for availability, liquidity or resolution rules.</p><button class="secondary" data-go="review" style="margin-top:20px">← Edit risks</button></div>${ticket()}</div></section>`;
if(p==='claim'){const currentTaken=taken&&savedCompany===company&&savedCountry===country;main.innerHTML=`<section class="view"><div class="claim-layout">${ticket(currentTaken)}<div><div class="eyebrow">${currentTaken?'YOURS TO KEEP':'ONE LAST LOOK'}</div><h2>Take your list<br>with you.</h2>${currentTaken?'<div class="success"><b>✓ Ticket saved</b>You’ve taken the list. No trade has been placed.</div>':'<p class="muted" style="margin:20px 0">Tearing means “I’m taking this list.” It doesn’t buy a contract or commit you to a trade.</p>'}<div class="claim-actions">${currentTaken?'<button class="primary" id="hm2-download">Download ticket ↓</button><button class="secondary" data-go="saved">View my tickets →</button>':'<button class="primary" id="hm2-tear">Tear & take this list ✂</button><button class="secondary" id="hm2-take">Take ticket without animation</button>'}<button class="secondary" data-go="review">Review my risks</button></div><div class="amber"><b>Not a broker or insurance.</b> These events may not cover your losses. Contracts pay $1 or $0; you can lose your stake.</div></div></div></section>`;
}
if(p==='saved')main.innerHTML=`<section class="view"><div class="eyebrow">YOUR SHORTLISTS</div><h2>My tickets</h2><p class="muted">A place for your next steps. No trades placed.</p>${taken?`<div class="saved"><div><span class="pill">TAKEN · DEMO</span><h3 style="margin-top:12px">${escape(savedCompany)}</h3><p class="muted">3 sample events · Fuel, freight and rates</p></div><button class="primary" id="hm2-open">Open ticket →</button></div><p class="fine">Saved for this preview session. Download a copy to keep it.</p>`:'<div class="empty"><h3>Your first ticket belongs here.</h3><p class="muted" style="margin-bottom:22px">Create a shortlist, then tear to take it.</p><button class="primary" data-go="home">Make a ticket →</button></div>'}</section>`;
if(p==='how')main.innerHTML=`<section class="view"><div class="eyebrow">FROM YOUR BUSINESS TO A SHORTLIST</div><h2>A small step toward being prepared.</h2><div class="risk-grid" style="margin-top:28px"><article class="risk"><h3>1. Share your website</h3><p>In the full product, we infer potential exposures from public business information.</p></article><article class="risk"><h3>2. Check the risks</h3><p>You correct the assumptions. We look for 3–7 relevant, liquid Polymarket events.</p></article><article class="risk"><h3>3. Take your list</h3><p>Pull and tear your ticket. You keep a shortlist; no trade happens here.</p></article></div><div class="amber"><b>The gap matters.</b> A market pays according to its event rules, not your business losses. This basis risk is part of every ticket.</div><button class="primary" data-go="home" style="margin-top:23px">Try the demo →</button></section>`;
main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));main.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;render('review')});
if(p==='home')main.querySelector('#hm2-form').onsubmit=e=>{e.preventDefault();const raw=main.querySelector('#hm2-url').value.trim();if(raw){try{const u=new URL(raw.includes('://')?raw:'https://'+raw);if(!u.hostname.includes('.')||!['http:','https:'].includes(u.protocol))throw Error();company=u.hostname.replace(/^www\./,'')}catch{const err=main.querySelector('#hm2-error');err.hidden=false;err.textContent='Enter a website such as yourbusiness.sg, or leave blank to try the local sample business.';return}}else company=presets[country].business;category='all';render('review')};
if(p==='review'){const update=()=>{let n=rel.slice(0,3).filter(x=>x!=='Not relevant').length;main.querySelector('#hm2-create').disabled=n<3;main.querySelector('#hm2-match').textContent=n<3?`Only ${n} sample matches remain. This demo needs fuel, freight and rates selected to make a 3-line ticket.`:'3 sample matches: fuel, freight and rates. No verified sample matches for tariffs or demand.'};main.querySelectorAll('[data-rel]').forEach(s=>s.onchange=()=>{rel[+s.dataset.rel]=s.value;update()});main.querySelector('#hm2-create').onclick=()=>render('ticket');update()}
const pull=main.querySelector('#hm2-pull');if(pull)pull.onclick=()=>render('claim');const take=()=>{taken=true;savedCompany=company;savedCountry=country;render('claim')};['hm2-tear','hm2-take'].forEach(id=>{const b=main.querySelector('#'+id);if(b)b.onclick=take});const dl=main.querySelector('#hm2-download');if(dl)dl.onclick=()=>{const text=main.querySelector('.receipt').innerText;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='hedge-ticket.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);dl.textContent='Ticket downloaded ✓'};const open=main.querySelector('#hm2-open');if(open)open.onclick=()=>{company=savedCompany;country=savedCountry;render('claim')};if(p==='home')setupHero();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
root.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{country=b.dataset.country;company=presets[country].business;render('home')});root.querySelectorAll('nav [data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));render('home');const opts={motion:motion};if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{motion=opts.motion;countryBar();if(page==='home')setupHero()}});t.addToggle(opts,'motion',{label:'Hero & ticket motion'});}
})();
</script>
