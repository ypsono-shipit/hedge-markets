<style>
#hm2{--blue:#0755ff;--ink:#081d60;--muted:#536b9d;--line:#cddfff;--paper:#ffffff;--bg:#f3f8ff;color-scheme:light;font:14px/1.5 Arial,sans-serif;color:var(--ink);background:var(--bg);border:1px solid #bedaff;border-radius:16px;overflow:hidden;box-shadow:0 12px 36px #2f84da1a}#hm2 *{box-sizing:border-box}#hm2 button,#hm2 input,#hm2 select{font:inherit}#hm2 button{cursor:pointer}#hm2 button:disabled{opacity:.45;cursor:default}#hm2 h1,#hm2 h2,#hm2 h3,#hm2 p{margin:0}#hm2 h1{font-size:clamp(36px,5.3vw,56px);line-height:1.06;letter-spacing:-2.3px;font-weight:700}#hm2 h2{font-size:34px;line-height:1.1;letter-spacing:-1.3px}#hm2 h3{font-size:20px;letter-spacing:-.4px}#hm2 .chrome{display:flex;gap:6px;align-items:center;background:linear-gradient(#4296f3,#7bb9f9);padding:9px 16px}#hm2 .light{width:8px;height:8px;border-radius:50%;background:#ff796f}#hm2 .light:nth-child(2){background:#ffd065}#hm2 .light:nth-child(3){background:#64d5a0}#hm2 .address{margin-left:9px;background:#ffffff4f;border:1px solid #ffffff3f;border-radius:20px;flex:1;padding:2px 13px;font-size:10px;color:#173d79}#hm2 nav{display:flex;gap:26px;align-items:center;background:#fffffff2;padding:19px 28px;border-bottom:1px solid #e1ecff}#hm2 .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.6px;margin-right:18px}#hm2 .mark{display:inline-block;width:24px;height:27px;border:2px solid var(--blue);border-radius:5px 2px;transform:skew(-11deg);box-shadow:inset 3px 0 #dceaff}#hm2 nav button{border:0;background:none;color:var(--ink);padding:4px 0;font-size:12px}#hm2 .tagline{font-size:10px;line-height:1.4;margin-left:auto}#hm2 .avatar{font-size:10px;background:#d6eaff;padding:9px;border-radius:50%;color:#0755ff}#hm2 .primary{background:var(--blue);border:1px solid #0755ff;border-radius:9px;padding:13px 20px;color:white;font-weight:600;box-shadow:0 4px 8px #0755ff16;display:inline-flex;align-items:center;justify-content:center;gap:14px}#hm2 .secondary{background:#ffffffa8;border:1px solid #b5ceff;border-radius:8px;padding:12px 18px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:12px}#hm2 .hero{position:relative;min-height:560px;isolation:isolate;overflow:hidden;padding:44px 34px 0;background:#2998f5}#hm2 .hero-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-3;animation:hm2-pan 12s ease-in-out infinite alternate}#hm2 .hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0874e8b8,transparent 65%),linear-gradient(0deg,#ecf6ff 0,transparent 25%);z-index:-2}#hm2 .hero-copy{max-width:560px;color:#fff;text-shadow:0 2px 9px #1268bd1f}#hm2 .hero-copy p{font-size:18px;max-width:355px;line-height:1.45;margin-top:17px}#hm2 .hero-badge{display:inline-flex;gap:7px;background:#ffffff20;border:1px solid #ffffff5c;border-radius:20px;font-size:10px;letter-spacing:1.3px;padding:5px 10px;margin-bottom:19px}#hm2 .intake{margin-top:146px;position:relative;max-width:710px;background:#ffffffed;border:1px solid #dae8ff;border-radius:15px;padding:17px;display:grid;grid-template-columns:1.4fr 1fr auto;gap:12px;align-items:end;box-shadow:0 9px 30px #2261a519}#hm2 label{display:block;font-size:11px;font-weight:600}#hm2 input,#hm2 select{width:100%;padding:11px 12px;border:1px solid #c4d8fd;border-radius:8px;background:#f9fcff;color:var(--ink);margin-top:7px;font-size:14px}#hm2 .steps{display:flex;gap:34px;padding:17px 7px 20px;font-size:10px}#hm2 .step{display:flex;align-items:center;gap:9px}#hm2 .step b{display:block}#hm2 .step em{font-style:normal;background:#438ee5;color:white;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px}#hm2 .view{padding:31px 34px 34px;background:radial-gradient(ellipse at bottom right,#e6f3ff,transparent 70%)}#hm2 .eyebrow{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);margin-bottom:15px}#hm2 .title-row{display:flex;gap:14px;justify-content:space-between;align-items:center}#hm2 .pill{font-size:10px;color:#2156a0;background:#e4f0ff;border-radius:8px;padding:8px 12px;white-space:nowrap}#hm2 .company{display:flex;gap:14px;align-items:center;margin:24px 0 17px}#hm2 .shop-icon{width:53px;height:53px;border-radius:12px;background:linear-gradient(#d2eaff,#f5faff);color:var(--blue);display:grid;place-items:center}#hm2 .shop-icon svg{width:29px;height:29px}#hm2 .muted{color:var(--muted);font-size:13px;margin-top:6px}#hm2 .tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}#hm2 .tabs button{border:1px solid transparent;background:#e7f1ff;color:var(--blue);border-radius:22px;padding:8px 16px;font-size:12px;display:flex;align-items:center;gap:8px}#hm2 .tabs button[aria-pressed=true]{border-color:#75a8ff;background:#d9eaff}#hm2 .risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}#hm2 .risk{border:1px solid var(--line);border-radius:13px;padding:20px;background:#ffffffb8}#hm2 .risk-top{display:flex;justify-content:space-between;align-items:center;color:var(--blue);margin-bottom:16px}#hm2 .risk-top svg{width:28px;height:28px}#hm2 .risk p{color:#3e5383;font-size:12px;min-height:54px;margin:7px 0 20px}#hm2 .risk h3{font-size:17px}#hm2 .risk label{font-weight:400}#hm2 .risk select{font-size:12px;padding:9px}#hm2 .actions{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:22px}#hm2 .info{display:flex;gap:9px;align-items:center;padding:12px 15px;border-radius:9px;background:#e0edff;font-size:11px}#hm2 .info svg{flex-shrink:0;color:var(--blue)}#hm2 .fine{font-size:10px;color:var(--muted);margin-top:15px}#hm2 .ticket-layout{display:grid;grid-template-columns:.9fr 1.2fr;gap:42px;align-items:start;max-width:870px;margin:auto}#hm2 .ticket-copy{padding-top:42px}#hm2 .ticket-copy h2{font-size:40px;letter-spacing:-1.6px}#hm2 .ticket-copy>p{margin:16px 0 25px;font-size:14px;color:#3e5383}#hm2 .warning{background:#e1f0ff;border:1px solid #c9e4ff;border-radius:12px;padding:18px;font-size:12px}#hm2 .warning b{display:block;font-size:18px;line-height:1.2;margin-bottom:9px}#hm2 .printer-wrap{padding:14px 12px 0;position:relative}#hm2 .printer{height:130px;border-radius:24px;background:linear-gradient(150deg,#66b7ff 0,#0957ff 23%,#0046ce 78%,#063896 100%);border:1px solid #0874e2;box-shadow:inset 0 4px 4px #c2e5ff9c,inset 5px 0 7px #87c8ff,0 9px 0 #0c4089,0 18px 25px #245c9b36;padding:24px 23px 18px;color:white;text-align:center}#hm2 .printer-brand{font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:19px}#hm2 .printer-brand .mark{border-color:white;width:20px;height:23px;box-shadow:none}#hm2 .slot{height:28px;background:#061336;border:5px solid #06378a;border-radius:11px;box-shadow:inset 0 4px 5px #000}#hm2 .receipt{margin:-27px 32px 0;background:linear-gradient(#c9cbd3 0,#fffef9 30px);padding:37px 24px 28px;color:#11172b;position:relative;font:11px/1.5 'Courier New',monospace;filter:drop-shadow(0 8px 7px #17365b20);clip-path:polygon(0 0,100% 0,100% 98%,97% 100%,94% 98%,91% 100%,88% 98%,85% 100%,82% 98%,79% 100%,76% 98%,73% 100%,70% 98%,67% 100%,64% 98%,61% 100%,58% 98%,55% 100%,52% 98%,49% 100%,46% 98%,43% 100%,40% 98%,37% 100%,34% 98%,31% 100%,28% 98%,25% 100%,22% 98%,19% 100%,16% 98%,13% 100%,10% 98%,7% 100%,4% 98%,0 100%);animation:hm2-print .8s ease-out}#hm2 .receipt.torn{margin-top:-5px;transform:rotate(-2deg);background:#fffef9}#hm2 .receipt h3{text-align:center;font-size:15px;letter-spacing:1px;font-family:inherit}#hm2 .receipt-head{text-align:center;border-top:1px dashed #9197a4;border-bottom:1px dashed #9197a4;padding:12px 0;margin:12px 0}#hm2 .receipt-row{padding:9px 0;border-bottom:1px dotted #c3c6cb;font-size:10px}#hm2 .receipt-row b{float:right;color:#0345c2}#hm2 .receipt-row small{display:block;font-size:9px;color:#5a6070;margin-top:3px}#hm2 .receipt-warning{font-size:10px;margin-top:15px}#hm2 .pull{display:block;width:100%;border:0;background:none;color:var(--blue);font-weight:600;padding:19px 0 0}#hm2 .pull span{display:block;font-size:26px;animation:hm2-bob 1.7s ease-in-out infinite}#hm2 details{margin-top:16px;font-size:12px}#hm2 summary{cursor:pointer;color:#365487}#hm2 details p{padding-top:9px;color:var(--muted)}#hm2 .claim-layout{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}#hm2 .success{background:#dcf8e5;border:1px solid #b9ebcb;padding:13px 16px;border-radius:11px;color:#155d2a;margin:22px 0 15px;font-size:12px}#hm2 .success b{display:block;font-size:14px}#hm2 .claim-actions{display:grid;gap:10px}#hm2 .amber{margin-top:24px;background:#fff1d4;border:1px solid #ffe0a1;border-radius:10px;padding:14px;color:#785219;font-size:11px}#hm2 .saved{display:flex;justify-content:space-between;gap:20px;align-items:center;border:1px solid var(--line);padding:23px;border-radius:13px;background:white;margin:25px 0}#hm2 .footer{display:flex;justify-content:space-between;gap:10px;padding:12px 28px;border-top:1px solid #d8e8ff;font-size:10px;color:#6880a8;background:#f8fbff}#hm2 .error{color:#9b300a;font-size:11px;grid-column:1/-1}#hm2 .empty{padding:45px 0;text-align:center}#hm2 .no-motion *{animation:none!important}#hm2 [hidden]{display:none!important}@keyframes hm2-pan{to{transform:scale(1.035) translateX(-4px)}}@keyframes hm2-bob{50%{transform:translateY(5px)}}@keyframes hm2-print{from{transform:translateY(-25px);opacity:.3}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){#hm2 *{animation:none!important}}@media(max-width:650px){#hm2 nav{padding:16px;gap:15px;flex-wrap:wrap}#hm2 .brand{margin-right:auto}#hm2 .tagline,#hm2 .avatar{display:none}#hm2 .hero{padding:30px 22px 0}#hm2 .hero-copy{max-width:400px}#hm2 .hero-art{object-position:62% center}#hm2 .hero:after{background:linear-gradient(90deg,#0874e8bd,transparent),linear-gradient(0deg,#edf7ff,transparent 40%)}#hm2 .intake{margin-top:150px;grid-template-columns:1fr}#hm2 .steps{gap:12px;flex-wrap:wrap}#hm2 .view{padding:26px 22px}#hm2 .title-row{align-items:start;flex-wrap:wrap}#hm2 .risk-grid,#hm2 .ticket-layout,#hm2 .claim-layout{grid-template-columns:1fr;gap:22px}#hm2 .risk p{min-height:0}#hm2 .actions{align-items:stretch;flex-direction:column}#hm2 .ticket-copy{padding-top:0}#hm2 .printer-wrap{max-width:410px;width:100%;margin:auto;padding:10px 0 0}#hm2 .receipt{margin-left:23px;margin-right:23px;padding-left:19px;padding-right:19px}#hm2 .footer{flex-wrap:wrap}#hm2 .saved{flex-wrap:wrap}}
</style>
<div id="hm2" aria-label="Hedge Markets blue product design"><div class="chrome" aria-hidden="true"><span class="light"></span><span class="light"></span><span class="light"></span><span class="address">hedgemarkets.sg<span id="hm2-path"></span></span></div><nav><div class="brand"><span class="mark"></span>Hedge Markets</div><button data-go="home">Home</button><button data-go="how">How it works</button><button data-go="saved">My tickets <span id="hm2-count"></span></button><span class="tagline">A little more prepared.<br>For Singapore’s small businesses.</span><span class="avatar">SG</span></nav><main id="hm2-main" aria-live="polite"></main><div class="footer"><span>Small businesses. Brighter tomorrows.</span><span>Illustrative prototype · No live markets or trades</span></div></div>
<script>
(()=>{const root=document.getElementById('hm2'),main=root.querySelector('#hm2-main');const hero='__HERO_DATA__';let company='Ah Huat Eats',savedCompany='',taken=false,page='home',category='all';let rel=['High','Medium','Medium','Not relevant','Not relevant'];const data=[['Fuel','flame','Delivery costs','Higher fuel prices may raise delivery costs.'],['Freight','truck','Imported ingredients','Freight disruption may raise supply costs.'],['Rates','chart-no-axes-column-increasing','Loan repayments','Higher rates may increase borrowing costs.'],['Tariffs','globe','Import duties','New duties may raise the price of imported supplies.'],['Demand','users','Customer visits','Lower spending may reduce food orders and catering bookings.']];const icons=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ticket(isTorn=false){return `<div class="printer-wrap"><div class="printer"><div class="printer-brand"><span class="mark"></span>${isTorn?'Your list, ready to keep':'Hedge Markets'}</div><div class="slot"></div></div><div class="receipt ${isTorn?'torn':''}"><h3>HEDGE MARKETS</h3><div class="receipt-head"><b>${escape(company.toUpperCase())}</b><br>ILLUSTRATIVE · 3 EVENTS</div><div class="receipt-row">FUEL <b>BUY YES</b><br>Brent above $100 on 31 Dec 2026?<small>Oil prices may not match your fuel bill.</small></div><div class="receipt-row">FREIGHT <b>BUY YES</b><br>Suez traffic below 2025 levels in Q4 2026?<small>Your suppliers may use different routes.</small></div><div class="receipt-row">RATES <b>BUY NO</b><br>Fed cuts rates by 31 Dec 2026?<small>US rates may diverge from your SGD loan.</small></div><div class="receipt-warning">CHECK BEFORE YOU ACT<br>Sample events, not verified listings.<br>Check liquidity, price and event rules.<br>May not offset your business losses.<br>Contracts pay $1 or $0.<br>You can lose your stake.</div></div>${!isTorn?'<button class="pull" id="hm2-pull"><span>↓</span>Pull down to review</button>':''}</div>`}
function render(p){page=p;root.querySelector('#hm2-path').textContent=p==='home'?'':'/'+p;root.querySelector('#hm2-count').textContent=taken?'(1)':'';
if(p==='home')main.innerHTML=`<section class="hero"><img class="hero-art" src="${hero}" alt="Chibi hawker uncle cooking at Ah Huat Eats, with families, HDB blocks and tropical palms"><div class="hero-copy"><span class="hero-badge">MADE FOR EVERYDAY BUSINESS OWNERS</span><h1>Big world changes.<br>Small business impact.</h1><p>Turn your business risks into a simple <b>event-market shortlist.</b></p></div><form class="intake" id="hm2-form"><label>Company website<input id="hm2-url" placeholder="yourbusiness.sg" aria-label="Company website"></label><label>Sector (optional)<select id="hm2-sector"><option>Food & beverage</option><option>Retail</option><option>Logistics</option><option>Manufacturing</option><option>Other / unsure</option></select></label><button class="primary" type="submit">Find my risks →</button><div id="hm2-error" class="error" role="alert" hidden></div></form><div class="steps"><div class="step"><em>1</em><span><b>Paste your URL</b>Tell us about your business</span></div><div class="step"><em>2</em><span><b>Review risks</b>Check what matters to you</span></div><div class="step"><em>3</em><span><b>Pull your ticket</b>Take your shortlist</span></div></div></section>`;
if(p==='review'){let visible=category==='all'?[0,1,2]:[data.findIndex(d=>d[0]===category)];main.innerHTML=`<section class="view"><div class="eyebrow">01 Business &nbsp; / &nbsp; 02 Review &nbsp; / &nbsp; 03 Ticket</div><div class="title-row"><h2>Does this sound like your business?</h2><span class="pill">Illustrative demo</span></div><div class="company"><div class="shop-icon">${icons('store')}</div><div><h3>${escape(company)}</h3><p class="muted">Sample profile · Neighbourhood food stalls and catering</p></div></div><div class="tabs"><button data-category="all" aria-pressed="${category==='all'}">Main risks</button>${data.map(d=>`<button data-category="${d[0]}" aria-pressed="${category===d[0]}">${icons(d[1])}${d[0]}</button>`).join('')}</div><div class="risk-grid">${visible.map(i=>`<article class="risk"><div class="risk-top">${icons(data[i][1])}<span class="pill">Editable</span></div><h3>${data[i][2]}</h3><p>${data[i][3]}</p><label>Relevance to your business<select data-rel="${i}">${['High','Medium','Low','Not relevant'].map(v=>`<option ${rel[i]===v?'selected':''}>${v}</option>`).join('')}</select></label></article>`).join('')}</div><div class="actions"><div class="info">${icons('info')}Sample assumptions, not a website scan. Please check before continuing.</div><button class="primary" id="hm2-create">Create hedge ticket →</button></div><p class="fine" id="hm2-match"></p></section>`}
if(p==='ticket')main.innerHTML=`<section class="view"><div class="eyebrow">YOUR SHORTLIST IS READY</div><div class="ticket-layout"><div class="ticket-copy"><h2>Your risks,<br>on one ticket.</h2><p>A simple shortlist of event markets based on the risks you reviewed.</p><div class="warning"><b>A shortlist,<br>not a safety net.</b>Event outcomes may not match your actual costs. Your business could lose money even if none of these contracts pays out.</div><details><summary>What does “BUY YES / NO” mean?</summary><p>A YES contract pays $1 if the event resolves YES, otherwise $0. NO pays the reverse. Price and fees determine your profit or loss.</p></details><p class="fine">Demo markets have not been verified for availability, liquidity or resolution rules.</p><button class="secondary" data-go="review" style="margin-top:20px">← Edit risks</button></div>${ticket()}</div></section>`;
if(p==='claim')main.innerHTML=`<section class="view"><div class="claim-layout">${ticket(taken)}<div><div class="eyebrow">${taken?'YOURS TO KEEP':'ONE LAST LOOK'}</div><h2>Take your list<br>with you.</h2>${taken?'<div class="success"><b>✓ Ticket saved</b>You’ve taken the list. No trade has been placed.</div>':'<p class="muted" style="margin:20px 0">Tearing means “I’m taking this list.” It doesn’t buy a contract or commit you to a trade.</p>'}<div class="claim-actions">${taken?'<button class="primary" id="hm2-download">Download ticket ↓</button><button class="secondary" data-go="saved">View my tickets →</button>':'<button class="primary" id="hm2-tear">Tear & take this list ✂</button><button class="secondary" id="hm2-take">Take ticket without animation</button>'}<button class="secondary" data-go="review">Review my risks</button></div><div class="amber"><b>Not a broker or insurance.</b> These events may not cover your losses. Contracts pay $1 or $0; you can lose your stake.</div></div></div></section>`;
if(p==='saved')main.innerHTML=`<section class="view"><div class="eyebrow">YOUR SHORTLISTS</div><h2>My tickets</h2><p class="muted">A place for your next steps. No trades placed.</p>${taken?`<div class="saved"><div><span class="pill">TAKEN · DEMO</span><h3 style="margin-top:12px">${escape(savedCompany)}</h3><p class="muted">3 sample events · Fuel, freight and rates</p></div><button class="primary" id="hm2-open">Open ticket →</button></div><p class="fine">Saved for this preview session. Download a copy to keep it.</p>`:'<div class="empty"><h3>Your first ticket belongs here.</h3><p class="muted" style="margin-bottom:22px">Create a shortlist, then tear to take it.</p><button class="primary" data-go="home">Make a ticket →</button></div>'}</section>`;
if(p==='how')main.innerHTML=`<section class="view"><div class="eyebrow">FROM YOUR BUSINESS TO A SHORTLIST</div><h2>A small step toward being prepared.</h2><div class="risk-grid" style="margin-top:28px"><article class="risk"><h3>1. Share your website</h3><p>In the full product, we infer potential exposures from public business information.</p></article><article class="risk"><h3>2. Check the risks</h3><p>You correct the assumptions. We look for 3–7 relevant, liquid Polymarket events.</p></article><article class="risk"><h3>3. Take your list</h3><p>Pull and tear your ticket. You keep a shortlist; no trade happens here.</p></article></div><div class="amber"><b>The gap matters.</b> A market pays according to its event rules, not your business losses. This basis risk is part of every ticket.</div><button class="primary" data-go="home" style="margin-top:23px">Try the demo →</button></section>`;
main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));main.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;render('review')});
if(p==='home')main.querySelector('#hm2-form').onsubmit=e=>{e.preventDefault();const raw=main.querySelector('#hm2-url').value.trim();if(raw){try{const u=new URL(raw.includes('://')?raw:'https://'+raw);if(!u.hostname.includes('.')||!['http:','https:'].includes(u.protocol))throw Error();company=u.hostname.replace(/^www\./,'')}catch{const err=main.querySelector('#hm2-error');err.hidden=false;err.textContent='Enter a website such as yourbusiness.sg, or leave blank to try Ah Huat Eats.';return}}else company='Ah Huat Eats';category='all';render('review')};
if(p==='review'){const update=()=>{let n=rel.slice(0,3).filter(x=>x!=='Not relevant').length;main.querySelector('#hm2-create').disabled=n<3;main.querySelector('#hm2-match').textContent=n<3?`Only ${n} sample matches remain. This demo needs fuel, freight and rates selected to make a 3-line ticket.`:'3 sample matches: fuel, freight and rates. No verified sample matches for tariffs or demand.'};main.querySelectorAll('[data-rel]').forEach(s=>s.onchange=()=>{rel[+s.dataset.rel]=s.value;update()});main.querySelector('#hm2-create').onclick=()=>render('ticket');update()}
const pull=main.querySelector('#hm2-pull');if(pull)pull.onclick=()=>render('claim');const take=()=>{taken=true;savedCompany=company;render('claim')};['hm2-tear','hm2-take'].forEach(id=>{const b=main.querySelector('#'+id);if(b)b.onclick=take});const dl=main.querySelector('#hm2-download');if(dl)dl.onclick=()=>{const text=main.querySelector('.receipt').innerText;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='hedge-ticket.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);dl.textContent='Ticket downloaded ✓'};const open=main.querySelector('#hm2-open');if(open)open.onclick=()=>{company=savedCompany;render('claim')};if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
root.querySelectorAll('nav [data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));render('home');const opts={motion:true};if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>root.querySelector('main').classList.toggle('no-motion',!opts.motion)});t.addToggle(opts,'motion',{label:'Hero & ticket motion'});}
})();
</script>
