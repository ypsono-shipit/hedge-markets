-muted);margin-bottom:28px;letter-spacing:.4px}#hedge .hm-split{display:grid;grid-template-columns:1.1fr .9fr;gap:45px;margin-top:28px}#hedge .hm-panel{background:var(--hm-paper);padding:25px;border:1px solid var(--hm-line);border-radius:13px}#hedge label.hm-label{display:block;font-size:12px;margin:0 0 9px}#hedge input[type=text],#hedge select{display:block;width:100%;background:var(--hm-bg);border:1px solid var(--hm-line);color:var(--hm-ink);border-radius:8px;padding:13px;margin-bottom:22px;font-size:16px}#hedge .hm-panel .hm-primary{width:100%;justify-content:space-between}#hedge .hm-help{color:var(--hm-muted);font-size:13px;margin-top:12px}#hedge .hm-rule{border-top:1px solid var(--hm-line);margin:22px 0}#hedge .hm-risk{display:grid;grid-template-columns:24px 1fr auto;gap:12px;padding:17px 0;border-bottom:1px solid var(--hm-line);align-items:start}#hedge .hm-risk:first-child{padding-top:0}#hedge .hm-risk input{accent-color:#386446;width:17px;height:17px}#hedge .hm-risk p{font-size:12px;color:var(--hm-muted);margin-top:4px}#hedge .hm-tag{font-size:10px;background:var(--hm-bg);padding:4px 7px;border-radius:4px;white-space:nowrap}#hedge .hm-alert{background:light-dark(#efeacb,#46452e);border-radius:8px;padding:15px;font-size:12px;margin-top:20px}#hedge .hm-actions{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:24px}#hedge .hm-machine{background:light-dark(#e3e9d9,#374635);border:1px solid var(--hm-line);border-radius:17px;padding:22px 21px 28px;position:relative}#hedge .hm-machine-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;margin-bottom:19px}#hedge .hm-slot{height:13px;border-radius:8px;background:#17392c;box-shadow:inset 0 3px 4px #0008}#hedge .hm-receipt{background:#fffdf4;color:#2d3b31;margin:-5px 12px 0;padding:26px 21px 20px;box-shadow:0 8px 14px #203a2520;position:relative;transition:transform .6s,margin .6s;animation:hm-print .8s ease-out;clip-path:polygon(0 0,100% 0,100% 98%,95% 100%,90% 98%,85% 100%,80% 98%,75% 100%,70% 98%,65% 100%,60% 98%,55% 100%,50% 98%,45% 100%,40% 98%,35% 100%,30% 98%,25% 100%,20% 98%,15% 100%,10% 98%,5% 100%,0 98%);font-family:monospace;font-size:11px}#hedge .hm-receipt.torn{transform:rotate(-3deg) translateY(12px);margin-bottom:20px}#hedge .hm-receipt h3{text-align:center;font-family:monospace;font-size:20px;letter-spacing:-1px}#hedge .hm-receipt .hm-ticket-meta{text-align:center;font-size:10px;margin:9px 0 19px}#hedge .hm-ticket-line{border-top:1px dashed #adb6a3;padding:13px 0}#hedge .hm-ticket-line strong{font-size:11px;display:block;margin:3px 0}#hedge .hm-ticket-line p{color:#626b60;font-size:10px}#hedge .hm-side{float:right;color:#254e35;background:#e7efcf;padding:1px 5px}#hedge .hm-ticket-warning{border-top:1px dashed #8e9a83;padding-top:13px;font-size:10px}#hedge .hm-tear{width:100%;border:0;border-top:2px dashed #96a787;background:transparent;color:var(--hm-ink);padding:14px 0 0;margin-top:21px;font-size:12px}#hedge .hm-detail{margin-top:16px}#hedge summary{cursor:pointer;padding:13px 0;border-bottom:1px solid var(--hm-line);font-size:13px}#hedge details p{font-size:12px;color:var(--hm-muted);padding:12px 0}#hedge .hm-empty{text-align:center;padding:52px 15px}#hedge [hidden]{display:none!important}#hedge .hm-saved{margin-top:28px;display:flex;align-items:center;justify-content:space-between;gap:15px}#hedge .hm-error{color:#bc553a;font-size:12px;margin-bottom:15px}#hedge .hm-link{background:none;border:0;text-decoration:underline;color:var(--hm-ink);padding:0;font-size:12px}#hedge.motion-off *{animation:none!important}@keyframes hm-bob{50%{transform:rotate(5deg) translateY(-3px)}}@keyframes hm-cloud{50%{transform:translateX(25px)}}@keyframes hm-steam{to{transform:translateY(-18px);opacity:0}}@keyframes hm-print{from{transform:translateY(-35px);opacity:.2}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){#hedge *{animation:none!important;transition:none!important}}@media(max-width:680px){#hedge .hm-nav{padding:18px;gap:16px;flex-wrap:wrap}#hedge .hm-brand{width:100%}#hedge .hm-page{padding:28px 22px}#hedge .hm-hero,#hedge .hm-split{grid-template-columns:1fr;gap:26px}#hedge .hm-art{max-width:400px;width:100%;margin:auto}#hedge .hm-strip{gap:12px}#hedge .hm-risk{grid-template-columns:24px 1fr}#hedge .hm-risk .hm-tag{grid-column:2;justify-self:start}#hedge .hm-bottom{flex-wrap:wrap;padding:16px 22px}#hedge .hm-saved{flex-wrap:wrap}}

<div id="hedge" aria-label="Hedge Markets product mockup">
 <header class="hm-nav"><div class="hm-brand"><span class="hm-logo">h.</span> hedge markets <span class="hm-demo">CONCEPT</span></div><button data-page="home" class="active">Home</button><button data-page="intake">Make a ticket</button><button data-page="saved">My tickets <span id="hm-count">0</span></button></header>
 <main id="hm-main" aria-live="polite"></main>
 <footer class="hm-bottom"><span>Built for the businesses that keep Singapore going.</span><span>Illustrative prototype · No live markets or trades</span></footer>
</div>
<script>
(()=>{const root=document.getElementById('hedge'),main=root.querySelector('#hm-main');let company='Kopi & Co.',url='kopiandco.example',sector='Food & beverage',taken=false,page='home',selected=[true,true,true,false,false];const risks=[['Fuel & energy','Cooking gas and delivery costs may rise.','Likely'],['Freight','Imported beans and supplies travel by sea.','Check with owner'],['Interest rates','Loan repayments may rise if your rate floats.','Check with owner'],['Tariffs','Import duties may affect your suppliers.','Unconfirmed'],['Customer demand','Fewer visits could mean fewer cups sold.','Unconfirmed']];
const art=`<div class="hm-art" role="img" aria-label="Animated chibi hawker and shopkeeper in a Singapore neighbourhood, with HDB blocks and striped shop awnings"><div class="hm-cloud"></div><div class="hm-block one"></div><div class="hm-block two"></div><div class="hm-ground"></div><div class="hm-bubble">Small business. Big heart.</div><div class="hm-shop"><div class="hm-sign">KOPI & CO.</div><div class="hm-awning"></div><div class="hm-person"><div class="hm-head"></div><div class="hm-hat"></div></div><div class="hm-counter"></div><div class="hm-steam">〰</div><div class="hm-pot"></div></div><div class="hm-shop second"><div class="hm-sign">PROVISION SHOP</div><div class="hm-awning"></div><div class="hm-person"><div class="hm-head"></div><div class="hm-hat"></div></div><div class="hm-counter"></div></div><div class="hm-art-label"><span>YOUR NEIGHBOURHOOD,</span><span>A LITTLE MORE PREPARED.</span></div></div>`;
const sampleEvents=[['FUEL','Brent oil above $100 on 31 Dec 2026?','YES','Oil can rise while your gas bill stays flat.'],['FREIGHT','Suez traffic below 2025 levels in Q4 2026?','YES','Your shipping route may be unaffected.'],['RATES','Fed cuts rates by 31 Dec 2026?','NO','US rates may diverge from your SGD loan.']];
function receipt(){return `<div class="hm-machine"><div class="hm-machine-top"><span>HEDGE TICKET / 001</span><span>● ${taken?'TAKEN':'READY TO PULL'}</span></div><div class="hm-slot"></div><div class="hm-receipt ${taken?'torn':''}"><h3>hedge markets</h3><div class="hm-ticket-meta">A LITTLE PLAN FOR THE WHAT-IFS<br><br><strong class="hm-company"></strong><br>ILLUSTRATIVE • NOT LIVE MARKETS</div>${sampleEvents.map((e,i)=>`<div class="hm-ticket-line"><span>0${i+1} / ${e[0]}</span><span class="hm-side">BUY ${e[2]}</span><strong>${e[1]}</strong><p>${e[3]}</p></div>`).join('')}<div class="hm-ticket-warning"><b>READ BEFORE YOU TAKE THIS.</b><br>Each contract settles at $1 or $0. You can lose your stake. A business loss does not guarantee a payout. Not insurance. Not a perfect hedge.<br><br>Sample events only. Liquidity, price and resolution rules have not been checked.</div></div><button class="hm-tear" id="hm-tear" ${taken?'disabled':''}>${taken?'✓ Ticket taken — list saved in this session':'↓ Pull & tear · I’m taking this list'}</button></div>`}
function render(next){page=next;root.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='home')main.innerHTML=`<section class="hm-page"><div class="hm-hero"><div><div class="hm-eyebrow"><span class="hm-dot"></span>For the everyday business owner</div><h1>Big world.<br>Small business.<br><span style="color:light-dark(#72904d,#b0ce80)">A little backup.</span></h1><p class="hm-sub">Rising costs? Uncertain times? Turn your business website into a short list of events worth keeping an eye on.</p><button class="hm-primary" data-go="intake">Make my hedge ticket <span>↗</span></button><div class="hm-note">Just your company URL. No trading account needed here.</div></div>${art}</div><div class="hm-strip"><div><span>01 / TELL US</span><b>Your business, in one link.</b><span>We look for what could affect your costs and sales.</span></div><div><span>02 / CHECK IT</span><b>You know your business best.</b><span>Correct our assumptions before making your list.</span></div><div><span>03 / TAKE IT</span><b>One ticket. A few what-ifs.</b><span>Pull, tear, and keep the list. You decide what comes next.</span></div></div></section>`;
if(page==='intake')main.innerHTML=`<section class="hm-page"><div class="hm-step">01 Business &nbsp; → &nbsp; 02 Risks &nbsp; → &nbsp; 03 Ticket</div><h2>Let’s start with your business.</h2><p class="hm-help">One link helps us ask better questions.</p><div class="hm-split"><form class="hm-panel" id="hm-form"><label class="hm-label" for="hm-url">Company website</label><input id="hm-url" type="text" placeholder="yourbusiness.com" required><label class="hm-label" for="hm-sector">Sector <span style="color:var(--hm-muted)">· optional</span></label><select id="hm-sector"><option>Food & beverage</option><option>Retail</option><option>Logistics</option><option>Manufacturing</option><option>Other / not sure</option></select><div id="hm-error" class="hm-error" role="alert"></div><button class="hm-primary" type="submit">Review possible risks <span>→</span></button><p class="hm-note">Prototype: any valid URL opens an editable sample review. No website is scanned.</p></form><div><div class="hm-eyebrow">A familiar example</div><h3>A kopi shop feels global changes, too.</h3><p class="hm-help">Coffee beans come by ship. Deliveries use fuel. A new outlet might have a loan.</p><div class="hm-rule"></div><button class="hm-secondary" id="hm-example">Try Kopi & Co. →</button><p class="hm-note">Fictional Singapore café · sample data</p><div class="hm-alert">We infer possible exposures, not facts. You’ll check what actually applies.</div></div></div></section>`;
if(page==='risks')main.innerHTML=`<section class="hm-page"><div class="hm-step">✓ Business &nbsp; → &nbsp; 02 Risks &nbsp; → &nbsp; 03 Ticket</div><h2>Does this sound like your business?</h2><p class="hm-help"><span class="hm-company"></span> · Sample assumptions for you to check</p><div class="hm-split"><div class="hm-panel">${risks.map((r,i)=>`<label class="hm-risk"><input type="checkbox" data-risk="${i}" ${selected[i]?'checked':''}><span>${r[0]}<p>${r[1]}</p></span><span class="hm-tag">${r[2]}</span></label>`).join('')}</div><div><div class="hm-eyebrow">Your reality comes first</div><h3>Keep only what affects you.</h3><p class="hm-help">Untick a risk if your costs are fixed, you don’t borrow, or it simply doesn’t fit.</p><div class="hm-alert"><b>A related event is not a matching loss.</b><br>Oil could spike without your supplier raising prices. Your costs could also rise without the event happening. That gap is called basis risk.</div><p class="hm-help" id="hm-selection"></p><div class="hm-actions"><button class="hm-secondary" data-go="intake">Back</button><button class="hm-primary" id="hm-print">Print sample ticket →</button></div><p class="hm-note">This concept shows 3 example events. A live ticket needs 3–7 suitable, liquid markets; otherwise we’d explain the shortfall.</p></div></div></section>`;
if(page==='ticket')main.innerHTML=`<section class="hm-page"><div class="hm-step">✓ Business &nbsp; → &nbsp; ✓ Risks &nbsp; → &nbsp; 03 Ticket</div><div class="hm-split" style="margin-top:0"><div><div class="hm-eyebrow"><span class="hm-dot"></span>${taken?'Yours to keep':'Fresh from the printer'}</div><h2>${taken?'Ticket taken.<br>You’re in control.':'Your next step,<br>on a small slip.'}</h2><p class="hm-sub">${taken?'You’ve saved a list to consider. Taking a ticket does not place a trade.':'Three example events, the side to buy, and the gaps to understand. Pull the ticket when you’re ready to keep the list.'}</p><div class="hm-alert"><b>This ticket won’t cover every loss.</b><br>Event contracts pay $1 or $0 based on the event’s rules, not on how your business performs.</div><details class="hm-detail"><summary>How would a contract pay out?</summary><p>A YES contract pays $1 if the event resolves YES, otherwise $0. A NO contract does the reverse. Your purchase price and fees affect your profit or loss.</p></details><details><summary>What should I check before buying?</summary><p>Read the exact resolution rules, date, available liquidity and price on the market. Check that the exposure applies to your business. These sample event names are not verified Polymarket listings.</p></details><div class="hm-actions"><button class="hm-link" data-go="risks">← Edit risks</button>${taken?'<button class="hm-secondary" data-go="saved">View my tickets →</button>':''}</div></div>${receipt()}</div></section>`;
if(page==='saved')main.innerHTML=`<section class="hm-page"><div class="hm-eyebrow">Your back pocket</div><h2>My tickets</h2><p class="hm-help">Lists you’ve taken. No trades placed.</p>${taken?`<div class="hm-panel hm-saved"><div><span class="hm-tag">TAKEN · SAMPLE</span><h3 class="hm-company" style="margin-top:10px"></h3><p class="hm-help">Ticket 001 · 3 example events · Fuel, freight, rates</p></div><button class="hm-secondary" data-go="ticket">Open ticket ↗</button></div><p class="hm-note">Saved only while this mockup is open.</p>`:`<div class="hm-empty"><h3>Your first ticket belongs here.</h3><p class="hm-help" style="margin-bottom:22px">Make a list, then pull and tear to keep it.</p><button class="hm-primary" data-go="intake">Make a ticket →</button></div>`}</section>`;
main.querySelectorAll('.hm-company').forEach(n=>n.textContent=company);main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));
if(page==='intake'){main.querySelector('#hm-sector').value=sector;main.querySelector('#hm-example').onclick=()=>{company='Kopi & Co.';url='kopiandco.example';sector='Food & beverage';render('risks')};main.querySelector('#hm-form').onsubmit=e=>{e.preventDefault();let raw=main.querySelector('#hm-url').value.trim();try{const u=new URL(raw.includes('://')?raw:'https://'+raw);if(!u.hostname.includes('.')||!['https:','http:'].includes(u.protocol))throw Error();url=u.hostname;company=url.replace(/^www\./,'');sector=main.querySelector('#hm-sector').value;render('risks')}catch{main.querySelector('#hm-error').textContent='Enter a website such as yourbusiness.com.'}}}
if(page==='risks'){const update=()=>{let matching=selected.slice(0,3).filter(Boolean).length;main.querySelector('#hm-selection').textContent=matching===3?'3 example events available for the selected risks.':`Only ${matching} sample matches. Select fuel, freight and rates to preview the 3-line ticket.`;main.querySelector('#hm-print').disabled=matching<3};main.querySelectorAll('[data-risk]').forEach(c=>c.onchange=()=>{selected[+c.dataset.risk]=c.checked;update()});main.querySelector('#hm-print').onclick=()=>{taken=false;root.querySelector('#hm-count').textContent='0';render('ticket')};update()}
if(page==='ticket')main.querySelector('#hm-tear').onclick=()=>{taken=true;root.querySelector('#hm-count').textContent='1';render('ticket')};}
root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));render('home');const design={motion:true,accent:'#d8ef85'};if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.classList.toggle('motion-off',!design.motion);root.style.setProperty('--hm-accent',design.accent)}});t.addToggle(design,'motion',{label:'Neighbourhood animation'});}
})();
</script>
